<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITOR-262 | Latência</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
            font-size: 3em;
            font-weight: 300;
            margin-bottom: 30px;
        }

        #lista-dispositivos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .online {
            border-left-color: #2ecc71 !important;
            color: #2ecc71 !important;
        }

        .alerta {
            border-left-color: #f1c40f !important;
            color: #f1c40f !important;
        }

        .offline {
            border-left-color: #e74c3c !important;
            color: #e74c3c !important;
        }

        .card {
            background: #1e1e1e;
            border-radius: 8px;
            border-left: 5px solid #444;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            height: 80px;
            display: flex;
            flex-direction: row;
            align-items: center;
            overflow: hidden;
        }

        /* Metade da Esquerda */
        .device-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Centraliza horizontalmente */
            justify-content: center;
            /* Centraliza verticalmente */
            text-align: center;
        }

        /* Metade da Direita */
        .device-status-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-name {
            font-size: 1.3em;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .device-ip {
            font-size: 1.3em;
            opacity: 0.4;
            margin: 0;
            line-height: 1.2;
        }

        .device-latency {
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>MONITOR-262 | Painel de Latência</h2>
    <div id="lista-dispositivos">Iniciando varredura...</div>

    <script>
        function atualizar() {
            fetch(`/status`)
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(err => { throw err; });
                    }
                    return res.json();
                })
                .then(data => {
                    const container = document.getElementById('lista-dispositivos');

                    // Se veio erro no corpo mesmo com 200 (não é o caso do HTTPException, mas mantemos)
                    if (data.error || data.detail) {
                        container.innerHTML = `
                    <div style="color:red; text-align:center; width:100%;">
                        ${data.error || data.detail}
                    </div>`;
                        return;
                    }

                    let htmlColetado = '';
                    Object.entries(data).forEach(([nome, info]) => {
                        const lat = info.latencia;
                        let classeStatus = 'offline';

                        if (info.status === "ONLINE") {
                            if (lat !== null && lat > 800) {
                                classeStatus = 'offline';
                            } else if (lat !== null && lat > 300) {
                                classeStatus = 'alerta';
                            } else {
                                classeStatus = 'online';
                            }
                        }

                        htmlColetado += `
                    <div class="card ${classeStatus}">
                        <div class="device-info">
                            <span class="device-name">${nome}</span>
                            <span class="device-ip">${info.ip}</span>
                        </div>
                        <div class="device-status-right">
                            ${info.latencia !== null ? `<span class="device-latency">${info.latencia} ms</span>` : '<span class="device-latency">---</span>'}
                        </div>
                    </div>
                `;
                    });

                    container.innerHTML = htmlColetado;
                })
                .catch(err => {
                    document.getElementById('lista-dispositivos').innerHTML =
                        `<div style="color:red; text-align:center; width:100%;">
                    ${err.detail || "Tentando reconectar à API..."}
                </div>`;
                });
        }

        setInterval(atualizar, 1500);
        atualizar();
    </script>

</body>

</html>
