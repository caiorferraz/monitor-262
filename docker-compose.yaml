services:
  nginx-service:
    # Online (up --build): busca a imagem no Hub caso não exista localmente
    # Offline (up): utiliza a imagem carregada (docker load)
    image: nginx:alpine
    container_name: "nginx-container"
    networks:
      - internal-net
    ports:
      - "80:80"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      # Injeta o HTML no servidor pronto
      - ./interface:/usr/share/nginx/html/monitor-262/
      # Configuração do Servidor
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - monitor-service
      # Limita logs 
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  monitor-service:
    # Online (up --build): constrói a partir do Dockerfile caso não exista localmente
    # Offline (up): utiliza a imagem carregada (docker load)
    build:
      context: .
      dockerfile: api/Dockerfile
    image: monitor-img:latest
    container_name: "monitor-container"
    networks:
      - internal-net
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Sao_Paulo
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --no-access-log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  internal-net:
    driver: bridge
